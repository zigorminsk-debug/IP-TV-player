name: "Build & Release"

# ---------------------------------------------------------------------------
# Автосборка и автопубликация релизов IP-TV Player.
# ---------------------------------------------------------------------------
# Схема версий (единый источник — version.properties, см. docs/04-RELEASE.md):
#
#     versionName = МАЖОР.МИНОР.<НОМЕР РЕЛИЗА>      (patch == номер релиза)
#     versionCode = номер сборки = github.run_number (только растёт)
#
# Что когда происходит:
#   * push в любую ветку   -> тесты + APK/AAB в артефактах (версия X.Y.N-dev);
#   * push в main          -> то же + НОВЫЙ релиз: следующий номер релиза,
#                             тег vX.Y.N, GitHub Release, app-update.json,
#                             запись в CHANGELOG.md и version.properties;
#   * push тега vX.Y.Z     -> релиз именно этой версии (номер релиза = Z);
#   * workflow_dispatch    -> ручная сборка, релиз только по галочке.
#
# Подпись: секреты репозитория приоритетнее закоммиченного keystore/
# (docs/06-SIGNING-KEYS.md).

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
    paths-ignore:
      - "ci-logs/**"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Версия для ручной сборки (например 1.0.7). Пусто = следующий номер релиза"
        required: false
        default: ""
      publish_release:
        description: "Опубликовать GitHub Release"
        type: boolean
        required: false
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build (build ${{ github.run_number }})"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Полная история и теги нужны, чтобы вычислить номер релиза
          # и записать результат обратно в main.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest runners come with the Android SDK preinstalled and
      # licenses accepted; AGP auto-installs any missing components.
      # This step only verifies/fills the gap if the image changes.
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_HOME:-}" ] && [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "SDK location: $SDK"
          if [ ! -d "$SDK/platform-tools" ]; then
            echo "::warning::Preinstalled SDK not found, installing cmdline-tools"
            CMDTOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            curl -fsSL --retry 3 -o /tmp/cmdtools.zip "$CMDTOOLS_URL"
            mkdir -p "$SDK/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          else
            echo "Using preinstalled SDK."
          fi

      # ------------------------------------------------------- версия/релиз
      - name: Determine version and release number
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
          INPUT_PUBLISH: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          chmod +x scripts/version.sh

          case "$GITHUB_EVENT_NAME" in
            push)
              if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
                MODE=tag; PUBLISH=true
              elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
                MODE=next; PUBLISH=true
              else
                MODE=dev; PUBLISH=false
              fi
              ;;
            workflow_dispatch)
              PUBLISH="${INPUT_PUBLISH:-false}"
              if [[ -n "${INPUT_VERSION:-}" ]]; then
                MODE=manual
              elif [[ "$PUBLISH" == "true" ]]; then
                MODE=next
              else
                MODE=dev
              fi
              ;;
            *)
              MODE=dev; PUBLISH=false
              ;;
          esac

          case "$MODE" in
            tag)    VERSION_OUT="$(scripts/version.sh --mode tag --tag "$GITHUB_REF_NAME")" ;;
            manual) VERSION_OUT="$(scripts/version.sh --mode manual --version "$INPUT_VERSION")" ;;
            next)   VERSION_OUT="$(scripts/version.sh --mode next)" ;;
            dev)    VERSION_OUT="$(scripts/version.sh --mode dev)" ;;
          esac
          eval "$VERSION_OUT"

          BUILD="${{ github.run_number }}"
          {
            echo "name=$VERSION_NAME"
            echo "release=$RELEASE_NUMBER"
            echo "tag=$TAG"
            echo "build=$BUILD"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          echo "APP_BUILD_TIME=$(date +%s)" >> "$GITHUB_ENV"

          echo "::notice title=Версия::$VERSION_NAME — релиз #$RELEASE_NUMBER, сборка $BUILD (публикация релиза: $PUBLISH)"
          {
            echo "### Версия сборки"
            echo
            echo "| Параметр | Значение |"
            echo "|---|---|"
            echo "| versionName | \`$VERSION_NAME\` |"
            echo "| Номер релиза | \`#$RELEASE_NUMBER\` |"
            echo "| versionCode (сборка) | \`$BUILD\` |"
            echo "| Тег | \`$TAG\` |"
            echo "| Публикация релиза | \`$PUBLISH\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Repo secrets override the committed keystore when present.
      - name: Prepare signing key (from secrets, optional)
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_TYPE: ${{ secrets.SIGNING_STORE_TYPE }}
          KS_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > /tmp/release-signing.p12
            echo "SIGNING_STORE_FILE=/tmp/release-signing.p12" >> "$GITHUB_ENV"
            if [ -n "$KS_TYPE" ]; then echo "SIGNING_STORE_TYPE=$KS_TYPE" >> "$GITHUB_ENV"; fi
            echo "SIGNING_STORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$KS_KEYPASS" >> "$GITHUB_ENV"
            echo "Using signing key from repository secrets."
          else
            echo "No signing secrets found - using the committed keystore/."
          fi

      # ------------------------------------------------------------- сборка
      - name: Build (tests + debug APK + release APK + AAB)
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: ${{ steps.ver.outputs.name }}
          APP_RELEASE_NUMBER: ${{ steps.ver.outputs.release }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug assembleRelease bundleRelease --stacktrace 2>&1 | tee build-output.log

      # On failure, publish a compact error digest to the ci/logs branch so
      # it can be fetched through the GitHub REST API (api.github.com).
      # The branch holds ONLY the digests — it is rebuilt from scratch.
      - name: Publish error digest (on failure)
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DIGEST="$RUNNER_TEMP/ci-logs/run-${{ github.run_number }}.md"
          mkdir -p "$(dirname "$DIGEST")"
          {
            echo "# Build failure digest — run ${{ github.run_number }} (${{ github.sha }})"
            echo
            echo "- Ветка/тег: \`${{ github.ref_name }}\`"
            echo "- Версия: \`${{ steps.ver.outputs.name }}\` (релиз #${{ steps.ver.outputs.release }})"
            echo "- Лог запуска: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "## Kotlin / javac errors"
            echo '```'
            grep -E "^e: |error: " build-output.log | head -250 || echo "(none captured)"
            echo '```'
            echo
            echo "## Test failures (with exception details)"
            echo '```'
            grep -E "(FAILED|SKIPPED)$" build-output.log | grep -v "^> Task" | head -80 || echo "(none)"
            grep -B1 -A25 "AssertionError\|ComparisonFailure\|expected:" build-output.log | head -300 || true
            echo '```'
            echo
            echo "## What went wrong"
            echo '```'
            sed -n '/What went wrong/,/^\* Try/p' build-output.log | head -80 || true
            echo '```'
            echo
            echo "## Failed tasks"
            echo '```'
            grep -E "^> Task .* FAILED|Execution failed for task" build-output.log | sort -u | head -60 || true
            echo '```'
            echo
            echo "## Log tail (last 120 lines)"
            echo '```'
            tail -120 build-output.log
            echo '```'
          } > "$DIGEST"

          WORK="$RUNNER_TEMP/ci-logs-repo"
          mkdir -p "$WORK/ci-logs"
          cp "$DIGEST" "$WORK/ci-logs/"
          cd "$WORK"
          git init -q -b ci/logs
          git config user.name "ci-bot"
          git config user.email "actions@github.com"
          git add ci-logs
          git commit -q -m "ci: error digest for run ${{ github.run_number }}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/ci/logs

      # ---------------------------------------------------------- артефакты
      - name: Collect and rename artifacts
        env:
          VERSION: ${{ steps.ver.outputs.name }}
          BUILD: ${{ steps.ver.outputs.build }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            "dist/IP-TV-Player_${VERSION}_build${BUILD}_debug.apk"
          cp app/build/outputs/apk/release/app-release.apk \
            "dist/IP-TV-Player_${VERSION}_build${BUILD}_release.apk"
          cp app/build/outputs/bundle/release/app-release.aab \
            "dist/IP-TV-Player_${VERSION}_build${BUILD}_release.aab"
          ls -la dist/

      - name: Verify release APK signature
        env:
          VERSION: ${{ steps.ver.outputs.name }}
          BUILD: ${{ steps.ver.outputs.build }}
        run: |
          set -euo pipefail
          APK="dist/IP-TV-Player_${VERSION}_build${BUILD}_release.apk"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -10

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: IP-TV-Player_${{ steps.ver.outputs.name }}_build${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

      # ------------------------------------------------------------- релиз
      - name: Generate app-update.json, checksums and release notes
        if: steps.ver.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.name }}
          RELEASE: ${{ steps.ver.outputs.release }}
          BUILD: ${{ steps.ver.outputs.build }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          APK="IP-TV-Player_${VERSION}_build${BUILD}_release.apk"

          # Примечания: текст аннотации тега, иначе сообщение последнего коммита.
          NOTES="$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null || true)"
          if [ -z "${NOTES// /}" ]; then
            NOTES="$(git log -1 --pretty=%B)"
          fi
          NOTES="$(printf '%s' "$NOTES" | head -c 1500)"

          python3 scripts/make_update_manifest.py \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --version-name "$VERSION" \
            --release-number "$RELEASE" \
            --build-number "$BUILD" \
            --apk "dist/$APK" \
            --apk-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$APK" \
            --notes "$NOTES" \
            --out dist/app-update.json

          # Контрольные суммы только для публикуемых файлов (без самого файла сумм).
          (cd dist && sha256sum IP-TV-Player_* app-update.json > SHA256SUMS.txt)

          {
            echo "**Версия:** \`$VERSION\` · **Релиз:** \`#$RELEASE\` · **Сборка (versionCode):** \`$BUILD\`"
            echo
            echo "Версии нумеруются по схеме \`мажор.минор.<номер релиза>\`, поэтому"
            echo "\`$VERSION\` — это релиз **#$RELEASE**. В приложении номер виден в"
            echo "«Настройки → О приложении»: \`$VERSION (релиз $RELEASE · сборка $BUILD)\`."
            echo
            echo "### Файлы"
            echo
            echo "| Файл | Назначение |"
            echo "|---|---|"
            echo "| \`$APK\` | подписанный APK — устанавливается поверх предыдущей версии |"
            echo "| \`IP-TV-Player_${VERSION}_build${BUILD}_release.aab\` | бандл для Google Play |"
            echo "| \`IP-TV-Player_${VERSION}_build${BUILD}_debug.apk\` | отладочная сборка (отдельный applicationId) |"
            echo "| \`app-update.json\` | манифест самообновления |"
            echo "| \`SHA256SUMS.txt\` | контрольные суммы |"
            echo
            echo "### Что нового"
            echo
            printf '%s\n' "$NOTES"
            echo
            echo "---"
            echo
            echo "Полная история версий — [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md)."
          } > "$RUNNER_TEMP/RELEASE_BODY.md"

          echo "--- app-update.json ---"
          cat dist/app-update.json

      - name: Publish GitHub Release
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "v${{ steps.ver.outputs.name }} — релиз #${{ steps.ver.outputs.release }} (сборка ${{ steps.ver.outputs.build }})"
          body_path: ${{ runner.temp }}/RELEASE_BODY.md
          files: |
            dist/*.apk
            dist/*.aab
            dist/app-update.json
            dist/SHA256SUMS.txt
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false

      # Фиксируем факт релиза в репозитории: строка в CHANGELOG.md + LAST_RELEASE.
      # Коммит делается от имени CI с [skip ci], новую сборку он не запускает.
      - name: Record release in CHANGELOG and version.properties
        if: steps.ver.outputs.publish == 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          VERSION: ${{ steps.ver.outputs.name }}
          RELEASE: ${{ steps.ver.outputs.release }}
          BUILD: ${{ steps.ver.outputs.build }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/record_release.py \
            --release "$RELEASE" \
            --version "$VERSION" \
            --build "$BUILD" \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY"

          if git diff --quiet -- CHANGELOG.md version.properties; then
            echo "Нечего фиксировать — файлы уже актуальны."
            exit 0
          fi

          git config user.name "ci-bot"
          git config user.email "actions@github.com"
          git add CHANGELOG.md version.properties
          git commit -q -m "chore(release): v$VERSION — релиз #$RELEASE (сборка $BUILD) [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Релиз зафиксирован в main."
              exit 0
            fi
            echo "Попытка $attempt не удалась, повтор через 5 с…"
            sleep 5
          done
          echo "::warning::Не удалось записать релиз в main (CHANGELOG/version.properties)"

      - name: Release summary
        if: steps.ver.outputs.publish == 'true'
        run: |
          {
            echo "### Опубликован релиз"
            echo
            echo "**[v${{ steps.ver.outputs.name }} — релиз #${{ steps.ver.outputs.release }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.ver.outputs.tag }})**"
            echo " (сборка ${{ steps.ver.outputs.build }})"
          } >> "$GITHUB_STEP_SUMMARY"
