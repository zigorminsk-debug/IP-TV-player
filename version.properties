# ---------------------------------------------------------------------------
# Единый источник версии IP-TV Player
# ---------------------------------------------------------------------------
# Схема версионирования (см. docs/04-RELEASE.md):
#
#   versionName = VERSION_MAJOR.VERSION_MINOR.<НОМЕР РЕЛИЗА>
#
# т.е. patch-компонента версии — это порядковый номер релиза. Каждый
# опубликованный релиз получает следующий номер: #2 -> 1.0.2, #3 -> 1.0.3 …
# Номер считает CI (scripts/version.sh) по уже существующим тегам vX.Y.Z,
# поэтому вручную его править не нужно.
#
#   versionCode = номер сборки = github.run_number (только растёт)
#
# Исторические исключения: релиз #1 был выпущен как v1.0.0 (до введения схемы).
VERSION_MAJOR=1
VERSION_MINOR=0

# Номер последнего опубликованного релиза. Обновляется автоматически шагом
# "Record release" в .github/workflows/android.yml; используется как запасной
# источник для локальных сборок (1.0.<LAST_RELEASE>-dev).
LAST_RELEASE=1
